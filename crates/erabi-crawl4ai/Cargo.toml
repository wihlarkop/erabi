[package]
name = "erabi-crawl4ai"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
erabi-crawler = { version = "0.1.0", path = "../erabi-crawler" }
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "rustls",
  "stream",
] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.1", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "time",
] }
